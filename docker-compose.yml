###############################################################################
#  SciPulse — docker-compose.yml
#  Elasticsearch · Logstash · Kibana · Airflow (+PostgreSQL) · MinIO · Spark
#  Démarrage : make up          (équivalent : python scripts/init_env.py
#                                 && docker compose up -d --build)
#  Prérequis : Docker Desktop, ~10 Go de RAM alloués à WSL2 (voir README)
###############################################################################

# Image construite une seule fois (par airflow-init), réutilisée par les autres
x-airflow-common: &airflow-common
  image: scipulse-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?lancer make env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?lancer make env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Connexions Airflow (secrets injectés depuis .env, jamais en dur)
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
    AIRFLOW_CONN_ELASTICSEARCH_DEFAULT: http://elasticsearch:9200
    AIRFLOW_CONN_MINIO_S3: '{"conn_type": "aws", "login": "${MINIO_ROOT_USER}", "password": "${MINIO_ROOT_PASSWORD}", "extra": {"endpoint_url": "http://minio:9000", "region_name": "us-east-1"}}'
    # Variables lues par le code applicatif (src/scipulse)
    PYTHONPATH: /opt/airflow/src
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ES_HOST: http://elasticsearch:9200
    SPARK_MASTER_URL: spark://spark-master:7077
    # Les tâches Airflow sont le driver Spark : les executors doivent pouvoir
    # le joindre par un nom DNS stable du réseau Docker
    SPARK_DRIVER_HOST: airflow-scheduler
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
    OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    # Échantillon ArXiv (surchargeable pour un jeu de test)
    ARXIV_SAMPLE_SIZE: ${ARXIV_SAMPLE_SIZE:-100000}
    ARXIV_MIN_YEAR: ${ARXIV_MIN_YEAR:-2015}
    ARXIV_SEED: ${ARXIV_SEED:-42}
    METRICS_DIR: /opt/airflow/data/metrics
    DATA_DIR: /opt/airflow/data
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./gx:/opt/airflow/gx                       # contexte Great Expectations
    - ./elasticsearch:/opt/airflow/elasticsearch # mappings versionnés
    - ./kibana:/opt/airflow/kibana               # dashboards (.ndjson)
  networks: [scipulse]

services:

  # ══════════════════════════════════════════════════════════════════════════
  #  ELASTICSEARCH — couche de serving Gold uniquement
  # ══════════════════════════════════════════════════════════════════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: scipulse-es
    environment:
      - discovery.type=single-node
      - cluster.name=scipulse-cluster
      # Sécurité désactivée en local (justifié dans le README) ;
      # en production : xpack.security + TLS + comptes de service
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_JAVA_HEAP} -Xmx${ES_JAVA_HEAP}
    ports: ["9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [scipulse]

  # ══════════════════════════════════════════════════════════════════════════
  #  LOGSTASH — collecte des métriques du pipeline (monitoring)
  # ══════════════════════════════════════════════════════════════════════════
  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    container_name: scipulse-logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9600:9600"]
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./data/metrics:/data/metrics:ro
      - logstash-data:/usr/share/logstash/data
    mem_limit: 1g
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [scipulse]

  # ══════════════════════════════════════════════════════════════════════════
  #  KIBANA
  # ══════════════════════════════════════════════════════════════════════════
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: scipulse-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["5601:5601"]
    mem_limit: 1536m
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
    networks: [scipulse]

  # ══════════════════════════════════════════════════════════════════════════
  #  POSTGRESQL — métastore Airflow
  # ══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: scipulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lancer make env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg-data:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [scipulse]

  # ══════════════════════════════════════════════════════════════════════════
  #  MINIO — data lake Medallion (Bronze / Silver)
  # ══════════════════════════════════════════════════════════════════════════
  minio:
    build: ./docker/minio
    image: scipulse-minio:RELEASE.2025-09-07T16-13-09Z
    container_name: scipulse-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?lancer make env}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes: [minio-data:/data]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [scipulse]

  # Création idempotente des buckets Bronze/Silver (one-shot)
  minio-init:
    <<: *airflow-common
    container_name: scipulse-minio-init
    command: ["python", "/opt/airflow/scripts/init_buckets.py"]
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  #  SPARK — master + 1 worker (standalone)
  # ══════════════════════════════════════════════════════════════════════════
  spark-master:
    build:
      context: ./docker
      dockerfile: spark/Dockerfile
    image: scipulse-spark:3.5.4
    container_name: scipulse-spark-master
    hostname: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports: ["8088:8080"]   # UI master (8080 est pris par Airflow)
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [scipulse]

  spark-worker:
    image: scipulse-spark:3.5.4
    container_name: scipulse-spark-worker
    hostname: spark-worker
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}",
              "--webui-port", "8081"]
    ports: ["8089:8081"]
    mem_limit: 3g
    depends_on:
      spark-master: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [scipulse]

  # ══════════════════════════════════════════════════════════════════════════
  #  AIRFLOW — orchestration
  # ══════════════════════════════════════════════════════════════════════════
  airflow-init:
    <<: *airflow-common
    container_name: scipulse-airflow-init
    build:
      context: ./docker
      dockerfile: airflow/Dockerfile
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin \
          --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname SciPulse --email admin@scipulse.local \
          || echo "Utilisateur admin déjà présent"
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: scipulse-airflow-web
    command: webserver
    ports: ["8080:8080"]
    mem_limit: 1536m
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: scipulse-airflow-sched
    hostname: airflow-scheduler
    command: scheduler
    mem_limit: 3g
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      elasticsearch: {condition: service_healthy}
      spark-master: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8974/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  es-data:
  pg-data:
  minio-data:
  logstash-data:

networks:
  scipulse:
    driver: bridge
