# =============================================================================
#  Pipeline Logstash — Métriques d'exécution du pipeline SciPulse
#  Chaque tâche Airflow écrit une ligne JSON par exécution dans
#  data/metrics/*.jsonl (volumes par couche, résultats GX, durée, statut).
#  Logstash les suit en continu et les indexe pour le dashboard de monitoring.
#  NB : index opérationnel, distinct des couches de données Medallion.
# =============================================================================

input {
  file {
    path => "/data/metrics/*.jsonl"
    mode => "tail"
    start_position => "beginning"
    # sincedb persistant (volume) : pas de ré-indexation après redémarrage
    sincedb_path => "/usr/share/logstash/data/sincedb_metrics"
    codec => "json"
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["@version", "host", "log", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "scipulse-pipeline-metrics"
  }
}
