# =============================================================================
#  CI SciPulse : lint + tests unitaires + validation de l'infrastructure
#  Déclenchée à chaque push et pull request.
# =============================================================================
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest + couverture)
        run: python -m pytest --cov=src/scipulse --cov-report=term-missing

      - name: Valider docker-compose.yml
        run: |
          python scripts/init_env.py
          docker compose config --quiet
